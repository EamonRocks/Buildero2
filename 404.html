<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Buildero 2 | Redirecting...</title>
    <script type="text/javascript">
      // GitHub Pages 404 Hack to handle SPA routing
      // This will redirect to index.html and include the original path in the URL
      var pathSegmentsToKeep = 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="background: #0a0a0c;">
  </body>
</html>
